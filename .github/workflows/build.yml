name: Build Session Photos
on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'Web/**'
      - 'Tests/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: State and network tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item -LiteralPath "build/SessionPhotos_artefacts/Release/VST3/Session Photos.vst3" -Destination package -Recurse
          Copy-Item README.md package/LIRE-MOI.md
          Copy-Item LICENSE package/LICENSE.txt
          Copy-Item THIRD_PARTY.md package/THIRD_PARTY.md
          "Source correspondant a cette compilation : https://github.com/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA" | Set-Content -Encoding utf8 package/SOURCES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SessionPhotos-Windows-VST3
          path: package/
          if-no-files-found: error
          retention-days: 30
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure universal Intel and Apple Silicon
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: State and network tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify and package
        run: |
          mkdir -p package
          cp -R "build/SessionPhotos_artefacts/Release/VST3/Session Photos.vst3" package/
          cp -R "build/SessionPhotos_artefacts/Release/AU/Session Photos.component" package/
          for bundle in "package/Session Photos.vst3" "package/Session Photos.component"; do
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --strict "$bundle"
            lipo "$bundle/Contents/MacOS/Session Photos" -verify_arch arm64 x86_64
          done
          cp LICENSE THIRD_PARTY.md package/
          echo "Sources: https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA" > package/SOURCES.txt
          cp MAC_AAX.md package/LIRE-MOI.md
          ditto -c -k --sequesterRsrc --keepParent package SessionPhotos_Mac_Universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SessionPhotos-Mac-Universal
          path: SessionPhotos_Mac_Universal.zip
          if-no-files-found: error
          retention-days: 30
